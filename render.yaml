services:
  - type: web
    name: battle-cats-editor-site
    runtime: docker
    plan: free
    dockerfilePath: ./bcsfe-web/Dockerfile
    dockerContext: ./bcsfe-web
    healthCheckPath: /
    envVars:
      - key: SITE_KEY
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: COOLDOWN_SECONDS
        value: "60"
